version: '3.3'

services:
  bagman:
    image: bagman
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
    volumes:
      - ${RECORDINGS_STORAGE}:${RECORDINGS_STORAGE}
      - /etc/localtime:/etc/localtime:ro
      # - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro # needed by elasticsearch for https connections
